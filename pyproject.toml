[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpent-traditional-grasp"
version = "0.1.0"
description = "Traditional bottle grasping for RPent and the AIR G1 robot"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=7.4", "ruff>=0.5"]
live = [
    "opencv-python>=4.8",
    "ultralytics>=8.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
